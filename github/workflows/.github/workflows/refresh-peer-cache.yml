name: Refresh peer cache
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-peer-cache
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m scripts.refresh_peer_cache --chunk 15 --delay 2.0
      - run: |
          if [ -z "$(git status --porcelain data/peers_cache.json)" ]; then exit 0; fi
          git config user.name peer-cache-bot
          git config user.email peer-cache-bot@users.noreply.github.com
          git add data/peers_cache.json
          git commit -m "chore(cache): daily peer refresh ($(date -u +%Y-%m-%d))"
          git push origin main
