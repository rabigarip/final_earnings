# Render Blueprint — Jabal earnings-preview deck generator
# Docs: https://render.com/docs/blueprint-spec
#
# Architecture (see README.md):
#   • Yahoo Finance (yfinance) is the always-available data backbone — price,
#     market cap, 52-week, performance, trailing+forward P/E, analyst rating /
#     target / # analysts, forward EPS & revenue estimates, and EPS earnings
#     history. Yahoo is NOT Cloudflare-blocked, so it works from Render's
#     datacenter IPs (this is what makes on-demand single-ticker generation
#     fill correctly).
#   • Investing.com / MarketScreener run as live enrichment via curl_cffi
#     (Chrome-TLS impersonation, the Cloudflare bypass) AND as the fallback
#     for Yahoo-blind names (e.g. Oman MSX: BKMB.OM). Committed snapshots
#     under data/investing + data/marketscreener are the last-resort fallback.
#   • data/disclosed/*.json provides verified full-year actuals (grounding).
#   • Gemini writes the analyst prose (sector-specific playbooks per family).
#
# IMPORTANT — plan: a full deck (with Gemini prose) takes ~60–100s. Render's
# FREE web tier hard-caps requests at ~30s and will 502. Use a paid instance
# (Starter or higher) for the LLM path, OR call the API with skip_llm=true for
# a fast (~30–60s) numbers-only deck. The blueprint requests `starter`.
services:
  - type: web
    name: final-earnings-api
    runtime: python
    region: oregon
    plan: starter            # paid: no 30s request cap (LLM path needs ~60-100s)

    buildCommand: chmod +x scripts/render_build.sh && bash scripts/render_build.sh
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Writable paths (Render's project dir is read-only; /tmp is writable).
      - key: DATABASE_PATH
        value: /tmp/earnings-data/earnings.db
      - key: REPORT_OUTPUT_DIR
        value: /tmp/earnings-outputs
      # Refresh the requested ticker from Yahoo (+ best-effort Investing/MS)
      # on every render so the canonical store is never stale. Set to 0 only
      # for offline fixture tests.
      - key: REFRESH_ON_RENDER
        value: "1"
      # Allow previews when a name is thin (maximize ticker coverage); the deck
      # degrades gracefully to "—" + a readiness flag rather than crashing.
      - key: REPORT_READINESS_MODE
        value: permissive
      # Route blocked-source fetches through the hardened curl_cffi path.
      - key: MS_USE_CURL_CFFI
        value: "1"
      # ── LLM-on mode ─────────────────────────────────────────────────────
      # Gemini writes the analyst prose (investment thesis, catalysts, risks,
      # what-to-watch) with sector-specific playbooks, grounded in the
      # numbers. REQUIRES a GEMINI_API_KEY (set it in the dashboard below).
      # If no key is present the deck degrades gracefully to the deterministic
      # template prose — it never blocks on the LLM. To run fully number-first
      # with zero LLM cost, set this to "1".
      - key: DISABLE_LLM
        value: "0"
      # ── Gemini (analyst prose). Only used when DISABLE_LLM=0. Set the value
      #    in the Render dashboard (Environment tab) — never commit the key. ──
      - key: GEMINI_API_KEY
        sync: false
      # Optional: restrict CORS to your frontend origin(s), comma-separated.
      # - key: CORS_ORIGINS
      #   value: https://final-earnings-api.onrender.com

# ─── Optional pre-warm cron (NOT deployed by default) ────────────────────────
# On-demand generation does not need this. If you later want the panel tickers'
# decks pre-rendered for instant download, add a `cron` service running
# `python -m scripts.render_panel_decks` on the same env. Snapshot freshness is
# already handled by the GitHub Actions in .github/workflows/, so a Render cron
# is not required.
