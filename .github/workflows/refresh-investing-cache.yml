name: Refresh Investing snapshots

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-investing
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "curl_cffi>=0.7" beautifulsoup4 lxml requests

      - name: Run Investing refresh
        run: python -m scripts.refresh_investing_cache --delay 2.0

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain data/investing/)" ]; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name  "investing-cache-bot"
          git config user.email "investing-cache-bot@users.noreply.github.com"
          git add data/investing/
          git commit -m "chore(cache): daily Investing refresh ($(date -u +%Y-%m-%d))"
          git push origin main
