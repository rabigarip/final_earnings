name: Refresh MarketScreener cache

# Cloudflare blocks Render's egress IPs from reaching marketscreener.com
# (HTTP 403 on every request). GHA runners use residential-class IPs
# that aren't currently flagged, so this workflow fetches every curated
# MS page nightly and commits the raw HTML to data/marketscreener/.
# Render's runtime falls back to those snapshots via the per-page
# _fetch_page() snapshot-read path in src/providers/marketscreener_pages.py.

on:
  schedule:
    # 04:50 UTC — runs ~20 minutes after the Investing.com refresh.
    - cron: "50 4 * * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (blank = all curated)"
        required: false
        default: ""
      panel_only:
        description: "Refresh only the 10-ticker production panel"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

concurrency:
  group: refresh-marketscreener
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # curl_cffi provides Chrome 120 TLS impersonation needed to
        # bypass MS's Cloudflare protection from datacenter IPs.
        run: |
          python -m pip install --upgrade pip
          pip install "curl_cffi>=0.7" requests beautifulsoup4 lxml pydantic

      - name: Run MarketScreener refresh
        env:
          MS_TRACKED_REFRESH: "1"
          MS_USE_CURL_CFFI: "1"
        run: |
          if [ "${{ github.event.inputs.panel_only }}" = "true" ]; then
            python -m scripts.refresh_marketscreener_cache --panel --delay 4
          elif [ -n "${{ github.event.inputs.tickers }}" ]; then
            python -m scripts.refresh_marketscreener_cache --tickers "${{ github.event.inputs.tickers }}" --delay 4
          else
            python -m scripts.refresh_marketscreener_cache --delay 4
          fi

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain data/marketscreener/)" ]; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name  "marketscreener-cache-bot"
          git config user.email "marketscreener-cache-bot@users.noreply.github.com"
          git add data/marketscreener/
          n=$(git diff --staged --name-only | wc -l | tr -d ' ')
          git commit -m "chore(cache): daily MarketScreener snapshot refresh (${n} files)"
          git push origin main
