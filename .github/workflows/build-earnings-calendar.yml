name: Build earnings calendar

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-earnings-calendar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance==0.2.*" requests

      - name: Build calendar
        run: python scripts/build_earnings_calendar.py 2>&1 | tail -25

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain data/calendar/upcoming.json)" ]; then
            echo "No calendar changes — nothing to commit."
            exit 0
          fi
          git config user.name  "earnings-calendar-bot"
          git config user.email "earnings-calendar-bot@users.noreply.github.com"
          git add data/calendar/upcoming.json
          git commit -m "chore(calendar): refresh ($(date -u +%Y-%m-%d))"
          git push origin main
